apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:    
      - job_name: 'my-app'
        metrics_path: /metrics
        static_configs:
          - targets: ['argo-app-service.argocd.svc.cluster.local:9113']